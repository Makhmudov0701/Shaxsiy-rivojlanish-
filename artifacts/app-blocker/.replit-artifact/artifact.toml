kind = "mobile"
previewPath = "/app-blocker/"
title = "Kunlik limit"
description = "An Android-first digital wellbeing app in Uzbek that tracks daily time spent in selected installed apps, shows per-app limits and countdowns, resets usage at midnight, and enforces limits with Android usage and accessibility permissions."
version = "1.0.0"
id = "artifacts/app-blocker"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/app-blocker/" ]
localPort = 21570

[services.development]
run = "pnpm --filter @workspace/app-blocker run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/app-blocker", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/app-blocker", "run", "serve" ]

[services.env]
PORT = "21570"
BASE_PATH = "/app-blocker/"
