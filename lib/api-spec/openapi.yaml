openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: diary
    description: Private diary operations
  - name: tasks
    description: Private task management operations
  - name: repetition
    description: Private spaced-repetition cards
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /diary/summary:
    get:
      operationId: getDiarySummary
      tags: [diary]
      summary: Get diary summary
      description: Returns lightweight stats for the signed-in user's diary.
      responses:
        "200":
          description: Diary summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiarySummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /diary/weekly-summary:
    get:
      operationId: getDiaryWeeklySummary
      tags: [diary]
      summary: Get a rule-based weekly diary summary
      description: Returns a short Uzbek reflection built from the signed-in user's entries from the last seven days.
      responses:
        "200":
          description: Weekly diary summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiaryWeeklySummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /diary/entries:
    get:
      operationId: listDiaryEntries
      tags: [diary]
      summary: List diary entries
      description: Returns the signed-in user's diary entries with optional search and filters.
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: mood
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/Mood"
        - name: folder
          in: query
          required: false
          schema:
            type: string
            maxLength: 40
        - name: favorite
          in: query
          required: false
          schema:
            type: boolean
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [newest, oldest]
            default: newest
      responses:
        "200":
          description: Diary entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DiaryEntry"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createDiaryEntry
      tags: [diary]
      summary: Create diary entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiaryEntryInput"
      responses:
        "201":
          description: Created diary entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiaryEntry"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /diary/entries/{id}:
    get:
      operationId: getDiaryEntry
      tags: [diary]
      summary: Get one diary entry
      parameters:
        - $ref: "#/components/parameters/DiaryEntryId"
      responses:
        "200":
          description: Diary entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiaryEntry"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateDiaryEntry
      tags: [diary]
      summary: Update diary entry
      parameters:
        - $ref: "#/components/parameters/DiaryEntryId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiaryEntryUpdate"
      responses:
        "200":
          description: Updated diary entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiaryEntry"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteDiaryEntry
      tags: [diary]
      summary: Delete diary entry
      parameters:
        - $ref: "#/components/parameters/DiaryEntryId"
      responses:
        "204":
          description: Diary entry deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /diary/entries/{id}/favorite:
    patch:
      operationId: toggleDiaryEntryFavorite
      tags: [diary]
      summary: Toggle diary entry favorite state
      parameters:
        - $ref: "#/components/parameters/DiaryEntryId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FavoriteUpdate"
      responses:
        "200":
          description: Updated diary entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiaryEntry"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /diary/entries/{id}/photos:
    post:
      operationId: uploadDiaryPhoto
      tags: [diary]
      summary: Upload a private photo for a diary entry
      parameters:
        - $ref: "#/components/parameters/DiaryEntryId"
        - name: X-File-Name
          in: header
          required: true
          schema:
            type: string
            maxLength: 180
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: Uploaded diary photo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiaryPhoto"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /diary/photos/{id}:
    get:
      operationId: getDiaryPhoto
      tags: [diary]
      summary: View a private diary photo
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Private diary photo bytes
          content:
            image/*:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteDiaryPhoto
      tags: [diary]
      summary: Delete a private diary photo
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "204":
          description: Diary photo deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /diary/settings:
    get:
      operationId: getDiarySettings
      tags: [diary]
      summary: Get private diary settings
      responses:
        "200":
          description: Diary settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiarySettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /diary/settings/pin:
    put:
      operationId: setDiaryPin
      tags: [diary]
      summary: Set or replace the four digit diary PIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PinInput"
      responses:
        "200":
          description: Updated diary settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiarySettings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      operationId: removeDiaryPin
      tags: [diary]
      summary: Remove the diary PIN
      responses:
        "200":
          description: Updated diary settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiarySettings"
        "409":
          description: The PIN is still required by an enabled daily usage limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /diary/settings/pin/verify:
    post:
      operationId: verifyDiaryPin
      tags: [diary]
      summary: Verify the four digit diary PIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PinInput"
      responses:
        "200":
          description: PIN verification result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PinVerification"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          description: Too many incorrect PIN attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /diary/active-time:
    get:
      operationId: getActiveTimeLimit
      tags: [diary]
      summary: Get this account's daily active-time limit and usage
      parameters:
        - name: timeZone
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 64
      responses:
        "200":
          description: Current account daily active-time state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActiveTimeLimit"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      operationId: updateActiveTimeLimit
      tags: [diary]
      summary: Update this account's daily active-time limit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActiveTimeLimitUpdate"
      responses:
        "200":
          description: Updated daily active-time state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActiveTimeLimit"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: A PIN must be enabled before turning on the daily limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: heartbeatActiveTime
      tags: [diary]
      summary: Record a foreground active-time heartbeat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActiveTimeHeartbeat"
      responses:
        "200":
          description: Updated daily active-time state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActiveTimeLimit"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /diary/active-time/override:
    post:
      operationId: overrideActiveTimeLimit
      tags: [diary]
      summary: Extend or reset today's active-time access after PIN verification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActiveTimeOverrideInput"
      responses:
        "200":
          description: Updated daily active-time state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActiveTimeLimit"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The supplied PIN is incorrect or not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The daily limit is not currently locked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Too many incorrect PIN attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /diary/export:
    get:
      operationId: exportDiary
      tags: [diary]
      summary: Export diary entries as JSON or PDF
      parameters:
        - name: format
          in: query
          required: true
          schema:
            type: string
            enum: [json, pdf]
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: id
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: tag
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Exported diary
          content:
            application/json:
              schema:
                type: object
                required: [exportedAt, entries]
                properties:
                  exportedAt:
                    type: string
                    format: date-time
                  entries:
                    type: array
                    items:
                      $ref: "#/components/schemas/DiaryEntry"
            application/pdf:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
  /diary/backup:
    get:
      operationId: downloadDiaryBackup
      tags: [diary]
      summary: Download a complete diary backup
      description: Returns all private entries and embedded media for the signed-in user as JSON.
      responses:
        "200":
          description: Complete diary backup
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiaryBackup"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /diary/backup/restore:
    post:
      operationId: restoreDiaryBackup
      tags: [diary]
      summary: Restore a complete diary backup
      description: Replaces the signed-in user's diary with a validated JSON backup.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiaryBackup"
      responses:
        "200":
          description: Restore result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestoreDiaryBackupResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /tasks:
    get:
      operationId: listTasks
      tags: [tasks]
      summary: List the signed-in user's tasks
      responses:
        "200":
          description: Tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createTask
      tags: [tasks]
      summary: Create a task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskInput"
      responses:
        "201":
          description: Created task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /tasks/{id}:
    patch:
      operationId: updateTask
      tags: [tasks]
      summary: Update a task or mark it complete
      parameters:
        - $ref: "#/components/parameters/TaskId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskUpdate"
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteTask
      tags: [tasks]
      summary: Delete a task
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /repetition/decks:
    get:
      operationId: listRepetitionDecks
      tags: [repetition]
      summary: List spaced-repetition decks
      responses:
        "200":
          description: Decks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RepetitionDeck"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createRepetitionDeck
      tags: [repetition]
      summary: Create a spaced-repetition deck
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepetitionDeckInput"
      responses:
        "201":
          description: Created deck
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepetitionDeck"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /repetition/decks/{id}:
    patch:
      operationId: updateRepetitionDeck
      tags: [repetition]
      summary: Rename a spaced-repetition deck
      parameters:
        - $ref: "#/components/parameters/RepetitionDeckId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepetitionDeckInput"
      responses:
        "200":
          description: Updated deck
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepetitionDeck"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteRepetitionDeck
      tags: [repetition]
      summary: Delete a spaced-repetition deck and its cards
      parameters:
        - $ref: "#/components/parameters/RepetitionDeckId"
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /repetition/cards:
    get:
      operationId: listRepetitionCards
      tags: [repetition]
      summary: List spaced-repetition cards
      description: Returns all spaced-repetition cards belonging to the signed-in user.
      responses:
        "200":
          description: Cards
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RepetitionCard"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createRepetitionCard
      tags: [repetition]
      summary: Create a spaced-repetition card
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepetitionCardInput"
      responses:
        "201":
          description: Created card
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepetitionCard"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /repetition/stats:
    get:
      operationId: getRepetitionStats
      tags: [repetition]
      summary: Get spaced-repetition progress
      parameters:
        - name: timeZone
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 64
      responses:
        "200":
          description: Progress counts and current review streak
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepetitionStats"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /repetition/cards/{id}:
    patch:
      operationId: updateRepetitionCard
      tags: [repetition]
      summary: Update a spaced-repetition card
      parameters:
        - $ref: "#/components/parameters/RepetitionCardId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepetitionCardInput"
      responses:
        "200":
          description: Updated card
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepetitionCard"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteRepetitionCard
      tags: [repetition]
      summary: Delete a spaced-repetition card
      parameters:
        - $ref: "#/components/parameters/RepetitionCardId"
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /repetition/cards/{id}/review:
    post:
      operationId: reviewRepetitionCard
      tags: [repetition]
      summary: Record a spaced-repetition review
      parameters:
        - $ref: "#/components/parameters/RepetitionCardId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepetitionReviewInput"
      responses:
        "200":
          description: Updated review schedule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepetitionCard"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  parameters:
    DiaryEntryId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    TaskId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    RepetitionCardId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    RepetitionDeckId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: The resource conflicts with an existing record
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Mood:
      type: string
      enum: [peaceful, happy, grateful, energized, thoughtful, sad, anxious]
    DiaryEntry:
      type: object
      required: [id, title, content, mood, folder, tags, favorite, entryDate, createdAt, updatedAt, photos]
      properties:
        id:
          type: integer
        title:
          type: string
        content:
          type: string
        mood:
          $ref: "#/components/schemas/Mood"
        folder:
          type: string
          minLength: 1
          maxLength: 40
        tags:
          type: array
          items:
            type: string
        favorite:
          type: boolean
        entryDate:
          type: string
          format: date
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        photos:
          type: array
          items:
            $ref: "#/components/schemas/DiaryPhoto"
    DiaryPhoto:
      type: object
      required: [id, entryId, fileName, contentType, size, url, createdAt]
      properties:
        id:
          type: integer
        entryId:
          type: integer
        fileName:
          type: string
        contentType:
          type: string
        size:
          type: integer
        url:
          type: string
        createdAt:
          type: string
          format: date-time
    DiarySettings:
      type: object
