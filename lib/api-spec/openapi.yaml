openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: diary
    description: Private diary operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /diary/summary:
    get:
      operationId: getDiarySummary
      tags: [diary]
      summary: Get diary summary
      description: Returns lightweight stats for the signed-in user's diary.
      responses:
        "200":
          description: Diary summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiarySummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /diary/weekly-summary:
    get:
      operationId: getDiaryWeeklySummary
      tags: [diary]
      summary: Get a rule-based weekly diary summary
      description: Returns a short Uzbek reflection built from the signed-in user's entries from the last seven days.
      responses:
        "200":
          description: Weekly diary summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiaryWeeklySummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /diary/entries:
    get:
      operationId: listDiaryEntries
      tags: [diary]
      summary: List diary entries
      description: Returns the signed-in user's diary entries with optional search and filters.
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: mood
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/Mood"
        - name: folder
          in: query
          required: false
          schema:
            type: string
            maxLength: 40
        - name: favorite
          in: query
          required: false
          schema:
            type: boolean
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [newest, oldest]
            default: newest
      responses:
        "200":
          description: Diary entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DiaryEntry"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createDiaryEntry
      tags: [diary]
      summary: Create diary entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiaryEntryInput"
      responses:
        "201":
          description: Created diary entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiaryEntry"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /diary/entries/{id}:
    get:
      operationId: getDiaryEntry
      tags: [diary]
      summary: Get one diary entry
      parameters:
        - $ref: "#/components/parameters/DiaryEntryId"
      responses:
        "200":
          description: Diary entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiaryEntry"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateDiaryEntry
      tags: [diary]
      summary: Update diary entry
      parameters:
        - $ref: "#/components/parameters/DiaryEntryId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiaryEntryUpdate"
      responses:
        "200":
          description: Updated diary entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiaryEntry"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteDiaryEntry
      tags: [diary]
      summary: Delete diary entry
      parameters:
        - $ref: "#/components/parameters/DiaryEntryId"
      responses:
        "204":
          description: Diary entry deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /diary/entries/{id}/favorite:
    patch:
      operationId: toggleDiaryEntryFavorite
      tags: [diary]
      summary: Toggle diary entry favorite state
      parameters:
        - $ref: "#/components/parameters/DiaryEntryId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FavoriteUpdate"
      responses:
        "200":
          description: Updated diary entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiaryEntry"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /diary/entries/{id}/photos:
    post:
      operationId: uploadDiaryPhoto
      tags: [diary]
      summary: Upload a private photo for a diary entry
      parameters:
        - $ref: "#/components/parameters/DiaryEntryId"
        - name: X-File-Name
          in: header
          required: true
          schema:
            type: string
            maxLength: 180
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: Uploaded diary photo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiaryPhoto"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /diary/photos/{id}:
    get:
      operationId: getDiaryPhoto
      tags: [diary]
      summary: View a private diary photo
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Private diary photo bytes
          content:
            image/*:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteDiaryPhoto
      tags: [diary]
      summary: Delete a private diary photo
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "204":
          description: Diary photo deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /diary/settings:
    get:
      operationId: getDiarySettings
      tags: [diary]
      summary: Get private diary settings
      responses:
        "200":
          description: Diary settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiarySettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /diary/settings/pin:
    put:
      operationId: setDiaryPin
      tags: [diary]
      summary: Set or replace the four digit diary PIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PinInput"
      responses:
        "200":
          description: Updated diary settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiarySettings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      operationId: removeDiaryPin
      tags: [diary]
      summary: Remove the diary PIN
      responses:
        "200":
          description: Updated diary settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiarySettings"
        "409":
          description: The PIN is still required by an enabled daily usage limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /diary/settings/pin/verify:
    post:
      operationId: verifyDiaryPin
      tags: [diary]
      summary: Verify the four digit diary PIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PinInput"
      responses:
        "200":
          description: PIN verification result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PinVerification"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          description: Too many incorrect PIN attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /diary/active-time:
    get:
      operationId: getActiveTimeLimit
      tags: [diary]
      summary: Get this account's daily active-time limit and usage
      parameters:
        - name: timeZone
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 64
      responses:
        "200":
          description: Current account daily active-time state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActiveTimeLimit"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      operationId: updateActiveTimeLimit
      tags: [diary]
      summary: Update this account's daily active-time limit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActiveTimeLimitUpdate"
      responses:
        "200":
          description: Updated daily active-time state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActiveTimeLimit"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: A PIN must be enabled before turning on the daily limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: heartbeatActiveTime
      tags: [diary]
      summary: Record a foreground active-time heartbeat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActiveTimeHeartbeat"
      responses:
        "200":
          description: Updated daily active-time state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActiveTimeLimit"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /diary/active-time/override:
    post:
      operationId: overrideActiveTimeLimit
      tags: [diary]
      summary: Extend or reset today's active-time access after PIN verification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActiveTimeOverrideInput"
      responses:
        "200":
          description: Updated daily active-time state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActiveTimeLimit"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The supplied PIN is incorrect or not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The daily limit is not currently locked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Too many incorrect PIN attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /diary/export:
    get:
      operationId: exportDiary
      tags: [diary]
      summary: Export diary entries as JSON or PDF
      parameters:
        - name: format
          in: query
          required: true
          schema:
            type: string
            enum: [json, pdf]
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: id
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: tag
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Exported diary
          content:
            application/json:
              schema:
                type: object
                required: [exportedAt, entries]
                properties:
                  exportedAt:
                    type: string
                    format: date-time
                  entries:
                    type: array
                    items:
                      $ref: "#/components/schemas/DiaryEntry"
            application/pdf:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
  /diary/backup:
    get:
      operationId: downloadDiaryBackup
      tags: [diary]
      summary: Download a complete diary backup
      description: Returns all private entries and embedded media for the signed-in user as JSON.
      responses:
        "200":
          description: Complete diary backup
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiaryBackup"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /diary/backup/restore:
    post:
      operationId: restoreDiaryBackup
      tags: [diary]
      summary: Restore a complete diary backup
      description: Replaces the signed-in user's diary with a validated JSON backup.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiaryBackup"
      responses:
        "200":
          description: Restore result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestoreDiaryBackupResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
components:
  parameters:
    DiaryEntryId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Mood:
      type: string
      enum: [peaceful, happy, grateful, energized, thoughtful, sad, anxious]
    DiaryEntry:
      type: object
      required: [id, title, content, mood, folder, tags, favorite, entryDate, createdAt, updatedAt, photos]
      properties:
        id:
          type: integer
        title:
          type: string
        content:
          type: string
        mood:
          $ref: "#/components/schemas/Mood"
        folder:
          type: string
          minLength: 1
          maxLength: 40
        tags:
          type: array
          items:
            type: string
        favorite:
          type: boolean
        entryDate:
          type: string
          format: date
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        photos:
          type: array
          items:
            $ref: "#/components/schemas/DiaryPhoto"
    DiaryPhoto:
      type: object
      required: [id, entryId, fileName, contentType, size, url, createdAt]
      properties:
        id:
          type: integer
        entryId:
          type: integer
        fileName:
          type: string
        contentType:
          type: string
        size:
          type: integer
        url:
          type: string
        createdAt:
          type: string
          format: date-time
    DiarySettings:
      type: object
      required: [pinEnabled]
      properties:
        pinEnabled:
          type: boolean
    PinInput:
      type: object
      required: [pin]
      properties:
        pin:
          type: string
          pattern: "^[0-9]{4}$"
    PinVerification:
      type: object
      required: [verified]
      properties:
        verified:
          type: boolean
    ActiveTimeLimit:
      type: object
      required:
        - enabled
        - limitSeconds
        - usedSeconds
        - extensionSeconds
        - effectiveLimitSeconds
        - remainingSeconds
        - locked
        - language
        - pinEnabled
        - timeZone
        - today
      properties:
        enabled:
          type: boolean
        limitSeconds:
          type: integer
        usedSeconds:
          type: integer
        extensionSeconds:
          type: integer
        effectiveLimitSeconds:
          type: integer
        remainingSeconds:
          type: integer
        locked:
          type: boolean
        language:
          type: string
          enum: [uz, ru, en, ko]
        pinEnabled:
          type: boolean
        timeZone:
          type: string
        today:
          type: string
          format: date
    ActiveTimeLimitUpdate:
      type: object
      required: [enabled, limitSeconds, language, timeZone]
      properties:
        enabled:
          type: boolean
        limitSeconds:
          type: integer
          minimum: 900
          maximum: 86400
          multipleOf: 900
        language:
          type: string
          enum: [uz, ru, en, ko]
        timeZone:
          type: string
          minLength: 1
          maxLength: 64
    ActiveTimeHeartbeat:
      type: object
      required: [timeZone]
      properties:
        timeZone:
          type: string
          minLength: 1
          maxLength: 64
    ActiveTimeOverrideInput:
      type: object
      required: [action, pin, timeZone]
      properties:
        action:
          type: string
          enum: [extend, reset]
        pin:
          type: string
          pattern: "^[0-9]{4}$"
        timeZone:
          type: string
          minLength: 1
          maxLength: 64
    DiaryEntryInput:
      type: object
      required: [title, content, mood, entryDate]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 160
        content:
          type: string
          minLength: 1
        mood:
          $ref: "#/components/schemas/Mood"
        folder:
          type: string
          minLength: 1
          maxLength: 40
          default: Shaxsiy
        tags:
          type: array
          maxItems: 8
          items:
            type: string
            maxLength: 32
        favorite:
          type: boolean
          default: false
        entryDate:
          type: string
          format: date
    DiaryEntryUpdate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 160
        content:
          type: string
          minLength: 1
        mood:
          $ref: "#/components/schemas/Mood"
        folder:
          type: string
          minLength: 1
          maxLength: 40
        tags:
          type: array
          maxItems: 8
          items:
            type: string
            maxLength: 32
        favorite:
          type: boolean
        entryDate:
          type: string
          format: date
    FavoriteUpdate:
      type: object
      required: [favorite]
      properties:
        favorite:
          type: boolean
    DiarySummary:
      type: object
      required: [totalEntries, thisMonth, writingStreak, favoriteCount, latestMood]
      properties:
        totalEntries:
          type: integer
        thisMonth:
          type: integer
        writingStreak:
          type: integer
        favoriteCount:
          type: integer
        latestMood:
          anyOf:
            - $ref: "#/components/schemas/Mood"
            - type: "null"
    DiaryWeeklyMood:
      type: object
      required: [mood, count]
      properties:
        mood:
          $ref: "#/components/schemas/Mood"
        count:
          type: integer
          minimum: 1
    DiaryWeeklySummary:
      type: object
      required: [weekStart, weekEnd, entryCount, activeDays, topMoods, summary, insight]
      properties:
        weekStart:
          type: string
          format: date
        weekEnd:
          type: string
          format: date
        entryCount:
          type: integer
          minimum: 0
        activeDays:
          type: integer
          minimum: 0
        topMoods:
          type: array
          items:
            $ref: "#/components/schemas/DiaryWeeklyMood"
        summary:
          type: string
        insight:
          type: string
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
    DiaryBackupPhoto:
      type: object
      required: [fileName, contentType, size, data]
      properties:
        fileName:
          type: string
          maxLength: 180
        contentType:
          type: string
        size:
          type: integer
          minimum: 0
        data:
          type: string
          description: Base64-encoded private media bytes
    DiaryBackupEntry:
      type: object
      required: [title, content, mood, folder, tags, favorite, entryDate, photos]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 160
        content:
          type: string
        mood:
          $ref: "#/components/schemas/Mood"
        folder:
          type: string
          minLength: 1
          maxLength: 40
        tags:
          type: array
          maxItems: 8
          items:
            type: string
            maxLength: 32
        favorite:
          type: boolean
        entryDate:
          type: string
          format: date
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        photos:
          type: array
          maxItems: 8
          items:
            $ref: "#/components/schemas/DiaryBackupPhoto"
    DiaryBackup:
      type: object
      required: [version, exportedAt, entries]
      properties:
        version:
          type: integer
          minimum: 1
        exportedAt:
          type: string
          format: date-time
        entries:
          type: array
          items:
            $ref: "#/components/schemas/DiaryBackupEntry"
    RestoreDiaryBackupResult:
      type: object
      required: [entriesRestored, photosRestored]
      properties:
        entriesRestored:
          type: integer
          minimum: 0
        photosRestored:
          type: integer
          minimum: 0

